[package]
name = "espocli"
version = "0.1.0"
edition = "2024"
description = "A token-efficient EspoCRM CLI for humans and AI agents"
license = "MIT"
repository = "https://github.com/MoisesRoig/EspoCLI"

[[bin]]
name = "espo"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
strip = true
lto = true
